[package]
name = "tray"
version = "0.1.2"
edition = "2024"
description = "Cross-platform tray icon library, with egui and iced support"
license = "MIT"
authors = ["nobane"]
repository = "https://github.com/nobane/tray-rs"
homepage = "https://github.com/nobane/tray-rs"
keywords = ["tray", "system-tray", "tray-icon"]
categories = ["gui"]


[features]
default = []
libxdo = ["dep:libxdo"]
serde = ["dep:serde", "dpi/serde"]
common-controls-v6 = []

[dependencies]
crossbeam-channel = "0.5"
keyboard-types = "0.7"
once_cell = "1"
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }
dpi = "0.1"

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.60"
features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
]

[target."cfg(target_os = \"linux\")".dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
libxdo = { version = "0.6.0", optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGDirectDisplay",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFRunLoop",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSArray",
  "NSAttributedString",
  "NSData",
  "NSDictionary",
  "NSEnumerator",
  "NSGeometry",
  "NSString",
  "NSThread",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSEvent",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }

[target."cfg(any(target_os = \"linux\", target_os = \"macos\"))".dependencies]
png = "0.17"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = "0.31"
iced = { version = "0.13", features = ["multi-window", "tokio"] }
